# Put in /etc/nginx/sites-available/chunav, symlink to sites-enabled. Replace chunav.example.com.
# This block handles ONLY this subdomain; other sites are untouched.
# Run `certbot --nginx -d chunav.example.com` afterwards: it adds the 443 block and certificates.
server {
    listen 80;
    listen [::]:80;
    server_name chunav.example.com;

    client_max_body_size 5m;

    location /api/public/stream {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
